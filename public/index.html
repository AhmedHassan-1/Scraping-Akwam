<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أكوام — بحث الأفلام والمسلسلات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-brand">
          <span class="logo-icon" aria-hidden="true">▶</span>
          <div>
            <h1>أكوام</h1>
            <p class="subtitle">ابحث، اختر، شاهد أو حمّل بجودة متعددة</p>
          </div>
        </div>
      </header>

      <section class="search-panel card">
        <form id="searchForm" class="search-form">
          <div class="search-input-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              type="text"
              id="searchInput"
              placeholder="اكتب اسم الفيلم أو المسلسل..."
              autocomplete="off"
              required
            />
          </div>
          <button type="submit" id="searchBtn" class="btn-search">بحث</button>
          <button type="button" id="cancelBtn" class="btn-danger hidden">
            إلغاء
          </button>
        </form>
      </section>

      <section id="progressSection" class="card hidden">
        <div class="progress-header">
          <span id="statusBadge" class="badge">جاري البحث</span>
          <span id="progressText" class="progress-text"></span>
        </div>
        <div class="progress-bar-track">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <p id="progressMessage" class="progress-message"></p>
      </section>

      <section id="selectionSection" class="card hidden">
        <div class="section-head">
          <h2>اختر النتائج المطلوبة</h2>
          <p class="hint">تم العثور على عدة نتائج — حدد ما تريد معالجته</p>
        </div>
        <div class="selection-actions">
          <button type="button" id="selectAllBtn" class="btn-secondary">
            تحديد الكل
          </button>
          <button type="button" id="clearAllBtn" class="btn-secondary">
            إلغاء التحديد
          </button>
        </div>
        <div id="candidatesList" class="candidates-list"></div>
        <button type="button" id="startProcessBtn" class="btn-primary">
          بدء المعالجة
        </button>
      </section>

      <section id="resultsSection" class="hidden">
        <div class="section-head">
          <h2 class="results-title">النتائج</h2>
        </div>
        <div id="resultsContainer" class="results-grid"></div>
      </section>
    </div>

    <footer class="site-footer">
      <p class="footer-made">Made by <strong>Ahmed Hassan</strong></p>
      <nav class="footer-links" aria-label="تواصل مع المطور">
        <a href="tel:+201142041272" class="footer-link">01142041272</a>
        <a
          href="https://www.facebook.com/Ahmed.Hassan219"
          class="footer-link"
          target="_blank"
          rel="noopener noreferrer"
          >Facebook</a
        >
        <a
          href="https://www.linkedin.com/in/ahmedhassan-ahmed"
          class="footer-link"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
      </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/app.js"></script>
  </body>
</html>
