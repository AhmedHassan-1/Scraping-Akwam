<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>مشاهدة — أكوام سينما</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/vendor/plyr/plyr.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/watch.css" />
    <link rel="stylesheet" href="/vendor/sweetalert2/sweetalert2.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
  </head>
  <body class="watch-page">
    <div class="ambient-glow glow-top" aria-hidden="true"></div>
    <div class="ambient-glow glow-bottom" aria-hidden="true"></div>

    <div class="watch-app">
      <!-- Responsive Header Navigation -->
      <header class="watch-header">
        <div class="watch-nav-bar">
          <button type="button" id="backToSearchBtn" class="back-link" aria-label="العودة لنتائج البحث">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 19 12 12 5"></polyline>
            </svg>
            <span class="back-text">العودة للنتائج السابقة</span>
          </button>

          <div class="watch-quick-actions">
            <button type="button" id="theaterModeToggleBtn" class="nav-pill-btn" title="توسيع أو تصغير وضع المسرح" aria-label="توسيع وضع المسرح">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
              <span class="btn-text">وضع السينما</span>
            </button>
            <a href="/" class="nav-pill-btn" title="الصفحة الرئيسية" aria-label="العودة للصفحة الرئيسية">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span class="btn-text">الرئيسية</span>
            </a>
          </div>
        </div>

        <!-- Responsive Title & Poster Card -->
        <div class="watch-title-wrap">
          <img id="watchPoster" class="watch-poster hidden" alt="بوستر العرض" loading="lazy" />
          <div class="watch-meta">
            <div class="now-playing-pill">
              <span class="pulse-dot" aria-hidden="true"></span>
              <span>قيد التشغيل الآن</span>
            </div>
            <h1 id="watchTitle">جاري تحميل الوسائط...</h1>
            <p id="watchSubtitle" class="watch-subtitle"></p>
          </div>
        </div>
      </header>

      <!-- Responsive Quality Selector Bar -->
      <section class="watch-controls card" id="qualitySection" aria-label="اختيار جودة الفيديو">
        <div class="control-label-group">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <label for="qualitySelect">جودة البث المتاحة:</label>
        </div>
        <div class="select-wrapper">
          <select id="qualitySelect" class="quality-select" aria-label="اختر جودة البث"></select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </div>
      </section>

      <!-- Responsive Cinema Stage & Video Player -->
      <div class="theater-stage">
        <div class="theater-glow" aria-hidden="true"></div>
        <section class="player-wrap card" aria-label="مشغل الفيديو">
          <video id="player" playsinline controls preload="metadata" poster=""></video>
          <p id="playerHint" class="player-hint hidden" role="alert"></p>
        </section>
      </div>

      <!-- Responsive Actions (Download & Copy Link) -->
      <section class="watch-actions card" aria-label="إجراءات التحميل والمشاركة">
        <a
          id="downloadBtn"
          class="btn-primary btn-download"
          href="#"
          target="_blank"
          rel="noopener"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="btn-download-text">تحميل الفيديو برابط مباشر عالي السرعة</span>
        </a>

        <button type="button" id="copyVideoLinkBtn" class="btn-secondary btn-copy-link" title="نسخ رابط الفيديو المباشر للجودة الحالية">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copyVideoLinkText">نسخ الرابط المباشر</span>
        </button>
      </section>

      <!-- Desktop Keyboard Shortcuts Guide (Hidden on Mobile/Touch) -->
      <div class="keyboard-shortcuts-pill" id="shortcutsPill" aria-hidden="true">
        <span class="shortcut-item"><kbd>المسافة</kbd> تشغيل / إيقاف</span>
        <span class="shortcut-sep">•</span>
        <span class="shortcut-item"><kbd>→</kbd> <kbd>←</kbd> تقديم / تأخير 5 ثواني</span>
        <span class="shortcut-sep">•</span>
        <span class="shortcut-item"><kbd>F</kbd> ملء الشاشة</span>
        <span class="shortcut-sep">•</span>
        <span class="shortcut-item"><kbd>M</kbd> كتم الصوت</span>
      </div>
    </div>

    <!-- Responsive Site Footer -->
    <footer class="site-footer">
      <p class="footer-made">Made by <strong>Ahmed Hassan</strong></p>
      <nav class="footer-links" aria-label="تواصل مع المطور">
        <a href="tel:+201142041272" class="footer-link">01142041272</a>
        <a
          href="https://www.facebook.com/Ahmed.Hassan219"
          class="footer-link"
          target="_blank"
          rel="noopener noreferrer"
          >Facebook</a
        >
        <a
          href="https://www.linkedin.com/in/ahmedhassan-ahmed"
          class="footer-link"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
      </nav>
    </footer>

    <script src="/vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script>
      if (typeof Swal === 'undefined') {
        document.write('<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"><\/script>');
      }
    </script>
    <script src="/vendor/plyr/plyr.polyfilled.js"></script>
    <script>
      if (typeof Plyr === 'undefined') {
        document.write('<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"><\\/script>');
      }
    </script>
    <script src="/watch.js"></script>
  </body>
</html>
